# Проверка квартир в GitHub Actions — работает независимо от домашнего компьютера.
#
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
name: flat-tracker

on:
  schedule:
    - cron: "*/15 * * * *"   # каждые 15 минут (GitHub может задержать запуск на 5–20 мин)
  workflow_dispatch:          # и кнопка «Run workflow» для проверки вручную

# чтобы шаг ниже мог закоммитить обновлённый state.json
permissions:
  contents: write

concurrency:
  group: flat-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Проверить квартиры
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 check.py --verbose

      - name: Сохранить состояние
        run: |
          git config user.name "flat-tracker"
          git config user.email "flat-tracker@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            # GitHub отключает расписание в репозиториях без активности 60 дней,
            # поэтому раз в неделю делаем пустой коммит-пульс.
            age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
            if [ "$age" -gt 604800 ]; then
              git commit --allow-empty -m "heartbeat: $(date -u +%FT%TZ)"
              git push
            fi
          else
            git commit -m "state: $(date -u +%FT%TZ)"
            git push
          fi
