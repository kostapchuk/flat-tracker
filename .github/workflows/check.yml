# Проверка квартир в GitHub Actions — работает независимо от домашнего компьютера.
#
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
name: flat-tracker

on:
  schedule:
    - cron: "*/5 * * * *"    # каждые 5 минут — это же и скорость ответа на команды бота
                             # (GitHub может задержать запуск на 5–20 минут)
  workflow_dispatch:          # и кнопка «Run workflow» для проверки вручную

# чтобы шаг ниже мог закоммитить обновлённый state.json
permissions:
  contents: write

concurrency:
  group: flat-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Проверить квартиры
        env:
          # рассылка идёт через бота на Cloudflare Workers — подписчики живут там
          BOT_URL: ${{ secrets.BOT_URL }}
          BROADCAST_SECRET: ${{ secrets.BROADCAST_SECRET }}
          # запасной путь: если бот не настроен, шлём напрямую владельцу
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 check.py --verbose

      - name: Сохранить состояние
        run: |
          git config user.name "flat-tracker"
          git config user.email "flat-tracker@users.noreply.github.com"
          git add state.json
          # last_ok/fails меняются каждый запуск — ради них коммитить не стоит,
          # иначе история превратится в 300 коммитов в сутки.
          # (|| true — grep без совпадений возвращает 1, а шаг идёт с set -e)
          meaningful=$(git diff --staged -U0 -- state.json \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -vE '"(last_ok_utc|fails)"' || true)

          if [ -n "$meaningful" ]; then
            git commit -m "state: $(date -u +%FT%TZ)"
            git push
          else
            # GitHub отключает расписание в репозиториях без активности 60 дней,
            # поэтому раз в неделю делаем пустой коммит-пульс
            age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
            if [ "$age" -gt 604800 ]; then
              git reset -q
              git commit --allow-empty -m "heartbeat: $(date -u +%FT%TZ)"
              git push
            fi
          fi
